version: 2

updates:
  # npm dependencies. Every update arrives as a pull request, so CI (lint, tests
  # and the packaging dry run) decides whether it is safe, which matters most for
  # Electron upgrades.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # Minor and patch bumps of dev tooling share one pull request.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [electron, electron-builder]

  # Versions of the actions used in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
