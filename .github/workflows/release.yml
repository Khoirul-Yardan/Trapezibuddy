name: Release

# Publishes a Windows installer to GitHub Releases when a version tag is pushed:
#
#   npm version patch        # bumps package.json and creates the tag vX.Y.Z
#   git push --follow-tags
#
# The tag must equal "v" + the version in package.json, otherwise nothing is built.
# Tags with a suffix (v1.2.0-rc.1) are published as pre-releases.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  # Same lint, test and packaging checks as for a pull request.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish installer
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    # The only job in the repo that can write to it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag must match package.json
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") {
            throw "Tag $env:TAG does not match package.json version $version"
          }
          Write-Host "Releasing $env:TAG"

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Write checksums
        shell: pwsh
        run: |
          $installers = Get-ChildItem dist -Filter '*.exe' -File | Where-Object { $_.Name -like '*Setup*' }
          if (-not $installers) { throw 'No installer was produced in dist/' }
          $installers | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          ## Installing

          Download the `Setup` installer below and run it.

          This build is **not code-signed yet**, so Windows SmartScreen may show
          "Windows protected your PC". Choose **More info**, then **Run anyway**.
          To check the download, compare its SHA-256 with `SHA256SUMS.txt`:

          ```powershell
          Get-FileHash .\<installer>.exe -Algorithm SHA256
          ```
          '@
          $releaseArgs = @($env:TAG, '--verify-tag', '--generate-notes', '--notes', $notes)
          if ($env:TAG -match '-') { $releaseArgs += '--prerelease' }
          $files = @(Get-ChildItem dist -Filter '*Setup*.exe' -File | ForEach-Object FullName) + (Resolve-Path dist\SHA256SUMS.txt).Path
          gh release create @releaseArgs @files
