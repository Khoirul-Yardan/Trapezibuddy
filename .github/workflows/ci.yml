name: CI

# Runs on every pull request and on every push to main.
# Windows runners are used on purpose: the app ships for Windows only and the
# code calls taskkill, so the tests and the packaging step should see Windows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never go looking for a signing certificate in CI.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  verify:
    name: Lint and test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Reported but not blocking: a new advisory in a dependency should not
      # turn an unrelated pull request red.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  package:
    name: Package (dry run)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The Electron binary and electron-builder's tools are large downloads.
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Builds the unpacked app only. This catches broken build configuration
      # (for example an invalid icon) without producing an installer.
      - name: Package unpacked app
        run: npx electron-builder --dir --publish never

      - name: Check the packaged app
        shell: pwsh
        run: |
          $exe = 'dist\win-unpacked\TrapeziBuddy.exe'
          if (-not (Test-Path $exe)) { throw "$exe was not produced" }
          foreach ($pet in 'GoldShip\goldship.exe', 'agnesTachyon\agnesTachyon.exe') {
            $path = "dist\win-unpacked\resources\assets\$pet"
            if (-not (Test-Path $path)) { throw "$path is missing from the package" }
          }
          Write-Host "Packaged app and character executables are present."
