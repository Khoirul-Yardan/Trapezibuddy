<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Sprite Generator + Preview</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}
.container { padding:20px; max-width:900px; margin:auto; }

.drop {
  border:2px dashed #38bdf8;
  padding:30px;
  border-radius:10px;
  cursor:pointer;
}

.preview {
  display:grid;
  grid-template-columns:repeat(auto-fill,80px);
  gap:10px;
  margin-top:20px;
}

.preview img {
  width:80px;
  height:80px;
  object-fit:contain;
  background:#000;
  border-radius:6px;
}

.controls {
  margin-top:15px;
}

canvas {
  margin-top:20px;
  background:black;
  border-radius:8px;
}

button {
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:#38bdf8;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="container">

<h2>Sprite Generator + Animation Preview</h2>

<div class="drop" id="drop">
Klik / drag gambar
<input type="file" id="file" multiple accept="image/*" hidden>
</div>

<div class="preview" id="preview"></div>

<div class="controls">
FPS: <input type="number" id="fps" value="6" min="1" max="60">
</div>

<button onclick="generate()">Generate & Download</button>

<canvas id="canvas"></canvas>

<h3>Preview Animasi</h3>
<canvas id="animCanvas" width="200" height="200"></canvas>

</div>

<script>
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const animCanvas = document.getElementById("animCanvas");
const actx = animCanvas.getContext("2d");

let images = [];
let rendering = false;

// animasi state
let animFrame = 0;
let lastTime = 0;
let frameWidth = 0;
let frameHeight = 0;

// klik
drop.onclick = () => fileInput.click();

// drag
drop.ondragover = e => e.preventDefault();
drop.ondrop = e => {
  e.preventDefault();
  loadFiles(e.dataTransfer.files);
};

fileInput.onchange = () => loadFiles(fileInput.files);

// load images
function loadFiles(files){
  images = [];
  preview.innerHTML = "";

  [...files].forEach(file=>{
    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = ()=>{
      images.push(img);

      const el = document.createElement("img");
      el.src = img.src;
      preview.appendChild(el);
    };
  });
}

// helper tunggu frame
function nextFrame(){
  return new Promise(res => requestAnimationFrame(res));
}

// generate sprite
async function generate(){
  if(images.length === 0){
    alert("Upload dulu");
    return;
  }

  if(rendering) return;
  rendering = true;

  let maxW=0, maxH=0;
  images.forEach(img=>{
    if(img.width>maxW) maxW=img.width;
    if(img.height>maxH) maxH=img.height;
  });

  frameWidth = maxW;
  frameHeight = maxH;

  canvas.width = maxW * images.length;
  canvas.height = maxH;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let i=0;i<images.length;i++){
    const img = images[i];

    const offsetX = (maxW - img.width)/2;
    const offsetY = (maxH - img.height)/2;

    ctx.drawImage(img, i*maxW + offsetX, offsetY);
    await nextFrame();
  }

  await nextFrame();

  // download
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "sprite.png";
    a.click();

    setTimeout(()=>URL.revokeObjectURL(url),1000);
    rendering = false;
  });
}

// loop animasi (smooth)
function animate(time){
  requestAnimationFrame(animate);

  if(images.length === 0 || frameWidth === 0) return;

  const fps = parseInt(document.getElementById("fps").value);
  const interval = 1000 / fps;

  if(time - lastTime < interval) return;
  lastTime = time;

  actx.clearRect(0,0,animCanvas.width,animCanvas.height);

  // scale ke canvas preview
  actx.drawImage(
    canvas,
    animFrame * frameWidth, 0,
    frameWidth, frameHeight,
    0, 0,
    animCanvas.width, animCanvas.height
  );

  animFrame++;
  if(animFrame >= images.length) animFrame = 0;
}

// start animasi
requestAnimationFrame(animate);
</script>

</body>
</html>
