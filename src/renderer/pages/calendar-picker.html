<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Date</title>
  <link rel="stylesheet" href="../assets/styles/calendar-picker.css" />
</head>
<body>
  <div class="calendar-container">
    
    <!-- Header -->
    <div class="calendar-header">
      <button type="button" class="calendar-nav-btn" id="btn-prev-month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="calendar-month-year" id="month-year">June 2026</div>
      <button type="button" class="calendar-nav-btn" id="btn-next-month">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Weekdays -->
    <div class="calendar-weekdays">
      <div class="calendar-weekday">Su</div>
      <div class="calendar-weekday">Mo</div>
      <div class="calendar-weekday">Tu</div>
      <div class="calendar-weekday">We</div>
      <div class="calendar-weekday">Th</div>
      <div class="calendar-weekday">Fr</div>
      <div class="calendar-weekday">Sa</div>
    </div>

    <!-- Days -->
    <div class="calendar-days" id="calendar-days">
      <!-- Generated by JavaScript -->
    </div>

    <!-- Footer -->
    <div class="calendar-footer">
      <button type="button" class="calendar-btn calendar-btn-clear" id="btn-clear">Clear</button>
      <button type="button" class="calendar-btn calendar-btn-select" id="btn-select" disabled>Select Date</button>
    </div>

  </div>

  <script src="../i18n.js"></script>
  <script src="../theme.js"></script>
  <script src="../components/calendar-picker.js"></script>
</body>
</html>
