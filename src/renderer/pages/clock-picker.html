<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Time</title>
  <link rel="stylesheet" href="../assets/styles/clock-picker.css" />
</head>
<body>
  <div class="clock-picker-container">

    <div class="clock-picker-drag-zone">
      <div class="clock-picker-header">ENTER TIME</div>
    </div>

    <div class="clock-picker-time-input">
      <!-- Hour -->
      <div class="clock-picker-input-group">
        <div class="clock-picker-input-box" id="hour-box">
          <input type="number" id="clock-hour" min="0" max="23" value="12" />
        </div>
        <div class="clock-picker-input-label">Hour</div>
      </div>

      <!-- Colon -->
      <div class="clock-picker-colon">:</div>

      <!-- Minute -->
      <div class="clock-picker-input-group">
        <div class="clock-picker-input-box" id="minute-box">
          <input type="number" id="clock-minute" min="0" max="59" value="00" />
        </div>
        <div class="clock-picker-input-label">Minute</div>
      </div>
    </div>

    <div class="clock-picker-footer">
      <div class="clock-picker-actions">
        <button class="clock-picker-btn" id="btn-cancel" type="button">Cancel</button>
        <button class="clock-picker-btn" id="btn-ok" type="button">OK</button>
      </div>
    </div>

  </div>

  <script src="../theme.js"></script>
  <script src="../components/clock-picker.js"></script>
</body>
</html>
