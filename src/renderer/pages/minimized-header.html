<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrapeziBuddy — Minimized</title>
  <link rel="stylesheet" href="../assets/styles/minimized-header.css" />
</head>
<body>

  <div class="header-bar" id="header-bar">

    <!-- Streak pill -->
    <div class="streak-pill">
      <div class="flame-icon">
        <svg viewBox="0 0 24 24" fill="#FF7043">
          <path d="M12 23C7.03 23 3 18.97 3 14c0-3.5 2-6.5 4.5-8.5C7 8 7.5
            10 9 11c0-3 1.5-7 5-9 0 2.5 1.5 4.5 3 6 .5-1 .5-2
            .5-3 2 2 3.5 5 3.5 8 0 4.97-4.03 9-9 9z"/>
        </svg>
      </div>
      <span class="streak-num" id="streak-count">0</span>
    </div>

    <!-- Task progress -->
    <div class="task-chip">
      <span class="task-progress" id="task-progress">0/0</span>
      <span class="task-label" data-i18n="task">Task</span>
    </div>

    <div class="divider"></div>

    <div class="spacer"></div>

    <!-- Date & time -->
    <span class="datetime" id="datetime-display">--/--/----&nbsp;&nbsp;--:-- --</span>

    <div class="divider"></div>



    <!-- Settings icon -->
    <button class="icon-btn" id="btn-settings" title="Settings" data-i18n-title="openSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83
          2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1
          1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0
          0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0
          0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65
          1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1
          2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0
          1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65
          0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65
          0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65
          1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>

    <!-- Expand (restore companion panel) -->
    <button class="icon-btn" id="btn-expand" title="Expand to full panel" data-i18n-title="expandPanel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>

    <!-- Close (exit) icon -->
    <button class="icon-btn" id="btn-exit" title="Exit" data-i18n-title="exit" style="margin-left:2px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

  </div>

  <script src="../i18n.js"></script>
  <script src="../theme.js"></script>
  <script type="module" src="../components/minimized-header.js"></script>
</body>
</html>
