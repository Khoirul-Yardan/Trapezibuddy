<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>TrapeziBuddy — Chat</title>
  <link rel="stylesheet" href="../assets/styles/global.css" />
  <link rel="stylesheet" href="../assets/styles/chat.css" />
</head>
<body>
  <div id="chat-app">

    <!-- ── Header ──────────────────────────────────────── -->
    <div class="chat-header" id="drag-region">
      <div class="header-logo">
        <svg width="22" height="16" viewBox="0 0 22 16" fill="none">
          <path d="M4 14L0 2H22L18 14H4Z" fill="#798777"/>
          <path d="M5.5 14L2 2H20L16.5 14H5.5Z" fill="#A2B29F"/>
        </svg>
        <span class="chat-title">TrapeziBuddy</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-settings" title="Pengaturan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-minimize" title="Sembunyikan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Chat Messages ───────────────────────────────── -->
    <div class="chat-messages" id="chat-messages">
      <!-- Pesan diisi oleh chat.js -->
    </div>

    <!-- ── Input Bar ────────────────────────────────────── -->
    <div class="chat-input-bar">
      <div class="chat-composer">
        <input
          type="text"
          class="chat-input"
          id="chat-input"
          placeholder="Type here . . ."
          autocomplete="off"
        />
        <button class="send-btn" id="btn-send" aria-label="Kirim">
          <!-- Play/send icon -->
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <polygon points="5,3 19,12 5,21"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script src="../components/chat.js"></script>
</body>
</html>
