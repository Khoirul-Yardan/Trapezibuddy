<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrapeziBuddy - Pilih Karakter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg:       #F8EDE3;
      --c-white:    #FFFFFF;
      --c-thatch:   #798777;
      --c-coconut:  #A2B29F;
      --c-zen-gray: #BDD2B6;
      --c-dark:     #3B3B3A;
      --c-mid:      #757676;
      --c-light:    #F3F4F4;
      --c-section:  #2C2C2B;
      --c-accent:   #FF6B6B;
      --c-accent-light: #FFE0E0;
    }

    html, body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--c-bg);
      color: var(--c-dark);
      -webkit-user-select: none;
      user-select: none;
      height: 100%;
      overflow: hidden;
    }

    /* ── Titlebar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--c-section);
      padding: 12px 16px;
      -webkit-app-region: drag;
    }

    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      color: #CCCCCC;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-close-title {
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #AAAAAA;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
      padding: 4px;
    }
    .btn-close-title:hover { background: #C62828; color: white; }
    .btn-close-title svg { width: 100%; height: 100%; }

    /* ── Main content ── */
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .content {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: center;
    }

    .header-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--c-dark);
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--c-mid);
    }

    /* ── Character cards ── */
    .characters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
    }

    .character-card {
      background: var(--c-white);
      border: 2px solid #E0E0E0;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      position: relative;
    }

    .character-card:hover {
      border-color: var(--c-thatch);
      box-shadow: 0 4px 12px rgba(121, 135, 119, 0.15);
      transform: translateY(-2px);
    }

    .character-card.selected {
      background: var(--c-accent-light);
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.2);
    }



    .character-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--c-zen-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      flex-shrink: 0;
    }

    .character-card.agnes .character-icon {
      background: linear-gradient(135deg, #FF69B4, #FF1493);
    }

    .character-card.goldship .character-icon {
      background: linear-gradient(135deg, #FFD700, #FFA500);
    }

    .character-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-dark);
    }

    .character-desc {
      font-size: 12px;
      color: var(--c-mid);
      line-height: 1.4;
    }

    .checkmark {
      margin-top: auto;
      font-size: 24px;
      color: var(--c-accent);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .character-card.selected .checkmark {
      opacity: 1;
    }

    /* ── Footer ── */
    .footer {
      background: var(--c-section);
      padding: 20px 24px;
      display: flex;
      gap: 12px;
      border-top: 1px solid #555;
    }

    .btn {
      flex: 1;
      height: 44px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-secondary {
      background: #555;
      color: white;
    }

    .btn-secondary:hover { background: #666; }
    .btn-secondary:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--c-thatch);
      color: white;
    }

    .btn-primary:hover { background: var(--c-coconut); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-primary:disabled {
      background: #CCC;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Titlebar -->
    <div class="titlebar">
      <div class="titlebar-title">
        <img src="../assets/styles/images/logo.svg" alt="TrapeziBuddy" style="height: 14px; width: auto;" />
        <span>Pilih Karakter</span>
      </div>
      <button class="btn-close-title" id="btn-close" title="Tutup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Header -->
      <div class="header">
        <div class="header-title">Pilih Karakter Favorit</div>
        <div class="header-subtitle">Tentukan karakter mana yang ingin menemani kamu hari ini</div>
      </div>

      <!-- Character cards -->
      <div class="characters">
        <!-- Character 1: Agnes -->
        <div class="character-card agnes" data-character="agnes">
          <div class="character-icon">👸</div>
          <div class="character-name">Agnes</div>
          <div class="character-desc">Karakter pintar dan elegan</div>
          <div class="checkmark">✓</div>
        </div>

        <!-- Character 2: Goldship -->
        <div class="character-card goldship" data-character="goldship">
          <div class="character-icon">🚢</div>
          <div class="character-name">Goldship</div>
          <div class="character-desc">Karakter petualang penuh gaya</div>
          <div class="checkmark">✓</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn btn-secondary" id="btn-cancel">Batal</button>
      <button class="btn btn-primary" id="btn-next" disabled>Lanjut</button>
    </div>
  </div>

  <script>
    const api = window.trapezi
    let selectedCharacter = 'agnes' // Default selection

    // Wait for API to be available
    function waitForApi(callback) {
      if (window.trapezi && window.trapezi.character) {
        callback()
      } else {
        setTimeout(() => waitForApi(callback), 100)
      }
    }

    const cards = document.querySelectorAll('.character-card')
    const btnNext = document.getElementById('btn-next')
    const btnCancel = document.getElementById('btn-cancel')
    const btnClose = document.getElementById('btn-close')

    // ── Selection handler ────────────────────────────────────
    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('selected'))
        card.classList.add('selected')
        selectedCharacter = card.dataset.character
        btnNext.disabled = false
      })
    })

    // Select default on load
    document.querySelector('[data-character="agnes"]').click()

    // ── Navigation ──────────────────────────────────────────
    btnNext.addEventListener('click', () => {
      console.log('btnNext clicked, selectedCharacter:', selectedCharacter)
      waitForApi(() => {
        console.log('API available, calling character.select')
        try {
          window.trapezi.character.select(selectedCharacter)
          console.log('character.select sent successfully')
        } catch (err) {
          console.error('Error calling character.select:', err)
        }
      })
    })

    btnCancel.addEventListener('click', () => {
      console.log('btnCancel clicked')
      try {
        window.trapezi.window.closeSettings()
      } catch (err) {
        console.error('Error calling closeSettings:', err)
      }
    })

    btnClose.addEventListener('click', () => {
      console.log('btnClose clicked')
      try {
        window.trapezi.window.closeSettings()
      } catch (err) {
        console.error('Error calling closeSettings:', err)
      }
    })

    console.log('character-selection.html loaded, API:', window.trapezi)
  </script>
</body>
</html>
