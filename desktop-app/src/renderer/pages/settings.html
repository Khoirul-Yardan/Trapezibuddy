<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrapeziBuddy Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #FBF9F8;
      color: #3B3B3A;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Header ── */
    .header {
      background: #2C2C2B;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 13px 18px;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    .header-logo {
      height: 18px;
      width: auto;
      display: block;
    }
    .branding-text {
      font-size: 20px;
      font-weight: 800;
      color: #7B3F00;
      letter-spacing: -0.3px;
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #aaa;
      cursor: pointer;
      -webkit-app-region: no-drag !important;
      display: flex;
      align-items: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }
    .btn-close:hover { color: white; background: rgba(255,255,255,0.12); }
    .btn-close svg { width: 16px; height: 16px; }

    /* ── Content Area ── */
    .content-area {
      flex-shrink: 0;
      overflow: hidden;
      padding: 16px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #FBF9F8;
    }

    /* ── Branding ── */
    .branding {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .branding-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #FFE8D6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .branding-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Section Cards ── */
    .section-card {
      background: #F5F3F3;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      width: 100%;
      overflow: hidden;
    }
    .section-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #3B3B3A;
    }
    .section-header svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── Character Options ── */
    .char-options {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .char-card {
      flex: 1;
      min-width: 0;
      background: #FFFFFF;
      border: 1px solid #E0E0E0;
      border-radius: 10px;
      padding: 12px 8px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.18s;
      -webkit-app-region: no-drag !important;
    }
    .char-card:hover {
      background: rgba(213, 232, 207, 0.3);
      border: 2px solid #52634F;
    }
    .char-card.active {
      background: rgba(213, 232, 207, 0.3);
      border: 2px solid #52634F;
    }
    .char-img-wrap {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
    }
    .char-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .char-name {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: #3B3B3A;
      line-height: 1.3;
    }

    /* ── Language Options ── */
    .lang-label {
      font-size: 12px;
      color: #3B3B3A;
    }
    .lang-options {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .lang-btn {
      flex: 1;
      min-width: 0;
      padding: 10px 6px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #E0E0E0;
      background: #FFFFFF;
      color: #3B3B3A;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      -webkit-app-region: no-drag !important;
    }
    .lang-btn:hover { background: #f5f5f5; }
    .lang-btn.active[data-lang="en"] {
      border: 2px solid #3B3B3A;
      background: #FFFFFF;
    }
    .lang-btn.active[data-lang="id"] {
      background: #F4A9A9;
      border: 1px solid #F4A9A9;
      color: #3B3B3A;
      font-weight: 700;
    }

    /* ── Footer ── */
    .footer {
      background: #2C2C2B;
      padding: 20px 18px;
      flex-shrink: 0;
    }
    .btn-start {
      width: 100%;
      padding: 15px;
      background: #A2B29F;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: filter 0.2s, transform 0.1s;
      -webkit-app-region: no-drag !important;
      font-family: inherit;
      letter-spacing: 0.1px;
    }
    .btn-start:hover { filter: brightness(1.08); }
    .btn-start:active { transform: scale(0.98); }
    .btn-start svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── GoldShip theme overrides ── */
    body.theme-goldship {
      background: #E8E2D8;
    }
    body.theme-goldship .content-area {
      background: #E8E2D8;
    }
    body.theme-goldship .header {
      background: #A5A5A5;
    }
    body.theme-goldship .header-title {
      color: #1A1714;
    }
    body.theme-goldship .btn-close {
      color: #1A1714;
    }
    body.theme-goldship .btn-close:hover {
      background: rgba(26, 23, 20, 0.1);
      color: #1A1714;
    }
    body.theme-goldship .branding-avatar {
      background: #9E8EC6;
    }
    body.theme-goldship .branding-text {
      color: #1A1714;
    }
    body.theme-goldship .section-card {
      background: #F3EFE9;
    }
    body.theme-goldship .section-header {
      color: #1A1714;
    }
    body.theme-goldship .char-card {
      background: #F3EFE9;
      border-color: #D0C8D8;
    }
    body.theme-goldship .char-card.active {
      background: rgba(198, 184, 227, 0.3);
      border: 2px solid #9E8EC6;
    }
    body.theme-goldship .char-card:hover {
      background: rgba(198, 184, 227, 0.2);
      border: 2px solid #9E8EC6;
    }
    body.theme-goldship .char-name,
    body.theme-goldship .lang-label {
      color: #1A1714;
    }
    body.theme-goldship .lang-btn.active[data-lang="en"] {
      border: 2px solid #9E8EC6;
    }
    body.theme-goldship .footer {
      background: #A5A5A5;
    }
    body.theme-goldship .btn-start {
      background: #9E8EC6;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img id="header-logo" class="header-logo"
         src="../assets/styles/images/agnesTachyon/logo.svg"
         alt="TrapeziBuddy">
    <button class="btn-close" id="btn-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <!-- Content -->
  <div class="content-area">

    <!-- Branding -->
    <div class="branding">
      <div class="branding-avatar">
        <img src="../assets/styles/images/agnesTachyon/agnesTahcyon.png" onerror="this.style.display='none'">
      </div>
      <div class="branding-text">TrapeziBuddy</div>
    </div>

    <!-- Section 1: Character Options -->
    <div class="section-card">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
        <span data-i18n="characterOptions" id="label-char-opt">Character Options</span>
      </div>

      <div class="char-options">
        <div class="char-card active" data-char="gugugaga">
          <div class="char-img-wrap">
            <img src="../assets/styles/images/agnesTachyon/agnesTahcyon.png" onerror="this.style.display='none'">
          </div>
          <div class="char-name">Gugu Gaga</div>
        </div>
        <div class="char-card" data-char="goldship">
          <div class="char-img-wrap">
            <img src="../assets/styles/images/goldShip/goldship.png" onerror="this.style.display='none'">
          </div>
          <div class="char-name">GoldShip</div>
        </div>
      </div>

    </div>

    <!-- Section 2: Language -->
    <div class="section-card">
      <div class="section-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/>
        </svg>
        <span data-i18n="language" id="label-lang">Language (Bahasa)</span>
      </div>

      <div class="lang-label" data-i18n="selectLanguage" id="label-select-lang">Select your preferred language:</div>
      <div class="lang-options">
        <button class="lang-btn active" data-lang="en">🇬🇧 English</button>
        <button class="lang-btn" data-lang="id">Indonesia</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn-start" id="btn-start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span data-i18n="startApp" id="label-start">Start Application</span>
    </button>
  </div>

  <script src="../i18n.js"></script>
  <script>
    const api = window.trapezi;

    let state = {
      character: 'gugugaga',
      language: 'en'
    };

    const BRANDING_IMGS = {
      gugugaga: '../assets/styles/images/agnesTachyon/agnesTahcyon.png',
      goldship:  '../assets/styles/images/goldShip/goldship.png',
    };

    const BRANDING_LOGOS = {
      gugugaga: '../assets/styles/images/agnesTachyon/logo.svg',
      goldship:  '../assets/styles/images/goldShip/logo.svg',
    };

    function applyThemePreview(character) {
      document.body.classList.remove('theme-gugugaga', 'theme-goldship');
      document.body.classList.add('theme-' + character);
      const avatar = document.querySelector('.branding-avatar img');
      if (avatar) avatar.src = BRANDING_IMGS[character] ?? BRANDING_IMGS.gugugaga;
      const logo = document.getElementById('header-logo');
      if (logo) logo.src = BRANDING_LOGOS[character] ?? BRANDING_LOGOS.gugugaga;
    }

    // Removed local updateLanguageText() as it's handled by the global i18n script

    function updateUI() {
      document.querySelectorAll('.char-card').forEach(el => {
        el.classList.toggle('active', el.dataset.char === state.character);
      });
      document.querySelectorAll('.lang-btn').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === state.language);
      });
      // Note: text translation is now handled reactively by the global i18n script.
    }

    async function loadSettings() {
      if (api && api.settings) {
        const stored = await api.settings.get();
        if (stored) {
          if (stored.character) state.character = stored.character;
          if (stored.language)  state.language  = stored.language;
        }
      }
      applyThemePreview(state.character);
      updateUI();
    }

    // Character selection
    document.querySelectorAll('.char-card').forEach(card => {
      card.addEventListener('click', () => {
        state.character = card.dataset.char;
        applyThemePreview(state.character);
        updateUI();
        window.trapezi?.theme?.apply(state.character);
      });
    });

    // Language selection
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.language = btn.dataset.lang;
        updateUI();
        if (api && api.language) {
          api.language.set(state.language);
        }
      });
    });

    // Close
    document.getElementById('btn-close').addEventListener('click', () => {
      if (api && api.window) api.window.closeSettings();
    });

    // Start
    document.getElementById('btn-start').addEventListener('click', async () => {
      if (api && api.settings && api.window) {
        const existing = await api.settings.get() || {};
        await api.settings.set({ ...existing, ...state });
        window.trapezi?.theme?.apply(state.character);
        api.window.startApp(state);
      }
    });

    loadSettings();

    // ── Global i18n Receiver ──
    async function applyLanguage(lang) {
      const t = window.i18n[lang] || window.i18n['en']
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n')
        if (t[key]) el.textContent = t[key]
      })
    }
    
    (async () => {
      if (api && api.settings) {
        const settings = await api.settings.get()
        applyLanguage(settings.language || 'en')
      }
    })();
    
    if (api && api.language) {
      api.language.onChange((lang) => {
        applyLanguage(lang)
      })
    }
  </script>
  <script>
    (async () => {
      try {
        const s = await window.trapezi?.settings?.get();
        document.body.classList.add('theme-' + (s?.character || 'gugugaga'));
      } catch (_) { document.body.classList.add('theme-gugugaga'); }
    })();
    window.trapezi?.onThemeApply?.((theme) => {
      document.body.classList.remove('theme-gugugaga', 'theme-goldship');
      document.body.classList.add('theme-' + theme);
    });
  </script>
</body>
</html>
