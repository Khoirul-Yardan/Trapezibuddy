<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrapeziBuddy Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg:       #F8EDE3;
      --c-white:    #FFFFFF;
      --c-thatch:   #798777;
      --c-coconut:  #A2B29F;
      --c-zen-gray: #BDD2B6;
      --c-dark:     #3B3B3A;
      --c-mid:      #757676;
      --c-light:    #F3F4F4;
      --c-section:  #2C2C2B;
    }

    html, body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--c-white);
      color: var(--c-dark);
      -webkit-user-select: none;
      user-select: none;
      height: 100%;
      overflow: hidden;
    }

    /* ── Titlebar ── */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--c-section);
      padding: 12px 16px;
      -webkit-app-region: drag;
    }

    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      color: #CCCCCC;
    }

    .btn-close-title {
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #AAAAAA;
      border-radius: 4px;
      transition: background 0.15s, color 0.15s;
      -webkit-app-region: no-drag;
      padding: 4px;
    }
    .btn-close-title:hover { background: #C62828; color: white; }
    .btn-close-title svg { width: 100%; height: 100%; }

    /* ── Main content ── */
    .content {
      padding: 28px 28px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── App header ── */
    .app-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .app-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--c-zen-gray);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .app-avatar img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    /* Placeholder avatar kalau gambar tidak ada */
    .app-avatar-placeholder {
      font-size: 28px;
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--c-dark);
      letter-spacing: -0.3px;
    }

    /* ── Size card ── */
    .size-card {
      background: var(--c-bg);
      border-radius: 16px;
      padding: 20px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .size-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .size-card-header svg {
      width: 18px;
      height: 18px;
      color: var(--c-thatch);
      flex-shrink: 0;
    }

    .size-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--c-dark);
    }

    .size-desc {
      font-size: 13px;
      color: var(--c-mid);
      line-height: 1.5;
    }

    /* Slider wrapper */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .slider-wrap {
      flex: 1;
      position: relative;
      height: 20px;
      display: flex;
      align-items: center;
    }

    /* Track */
    .slider-wrap input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(
        to right,
        var(--c-thatch) 0%,
        var(--c-thatch) var(--val, 20%),
        #D9CFC7 var(--val, 20%),
        #D9CFC7 100%
      );
    }

    /* Thumb */
    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--c-thatch);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .slider-wrap input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    .slider-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--c-dark);
      min-width: 42px;
      text-align: right;
    }

    /* Labels */
    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    .slider-labels span {
      font-size: 11px;
      color: var(--c-mid);
    }

    /* ── Footer ── */
    .footer {
      background: var(--c-section);
      padding: 20px 28px;
      margin-top: 8px;
    }

    .btn-start {
      width: 100%;
      height: 50px;
      border-radius: 14px;
      border: none;
      background: var(--c-thatch);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, transform 0.1s;
      letter-spacing: 0.1px;
    }

    .btn-start:hover  { background: var(--c-coconut); }
    .btn-start:active { transform: scale(0.98); }

    .btn-start svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Titlebar -->
  <div class="titlebar">
    <span class="titlebar-title">TrapeziBuddy Settings</span>
    <button class="btn-close-title" id="btn-close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- App header -->
    <div class="app-header">
      <div class="app-avatar">
        <img src="../assets/icons/gugu-neutral.png"
             alt="TrapeziBuddy"
             onerror="this.parentElement.innerHTML='<span class=\'app-avatar-placeholder\'>🐧</span>'"/>
      </div>
      <span class="app-title">TrapeziBuddy Settings</span>
    </div>

    <!-- Character size card -->
    <div class="size-card">
      <div class="size-card-header">
        <!-- Monitor icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span class="size-card-title">Character Size</span>
      </div>

      <div class="size-desc">Adjust the character display size:</div>

      <div>
        <div class="slider-row">
          <div class="slider-wrap">
            <input type="range" id="size-slider"
                   min="30" max="200" value="60"
                   oninput="updateSlider(this.value)"/>
          </div>
          <span class="slider-value" id="size-value">60%</span>
        </div>
        <div class="slider-labels">
          <span>Small = 50%</span>
          <span>Normal = 100%</span>
          <span>Large = 150%+</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn-start" id="btn-start">
      <!-- Checkmark circle icon -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      Start Application
    </button>
  </div>

  <script>
    const api = window.trapezi

    // ── Slider logic ──────────────────────────────────────
    function updateSlider(val) {
      const pct = ((val - 30) / (200 - 30)) * 100
      const slider = document.getElementById('size-slider')
      slider.style.setProperty('--val', pct + '%')
      // Update gradient manually for Electron
      slider.style.background = `linear-gradient(
        to right,
        #798777 0%,
        #798777 ${pct}%,
        #D9CFC7 ${pct}%,
        #D9CFC7 100%
      )`
      document.getElementById('size-value').textContent = val + '%'
    }

    // Init slider on load
    const slider = document.getElementById('size-slider')
    updateSlider(slider.value)

    // ── Close ─────────────────────────────────────────────
    document.getElementById('btn-close').addEventListener('click', () => {
      api.window.closeSettings()
    })

    // ── Start ─────────────────────────────────────────────
    document.getElementById('btn-start').addEventListener('click', () => {
      const size = parseInt(document.getElementById('size-slider').value)
      api.window.startApp({ characterSize: size })
    })
  </script>
</body>
</html>
