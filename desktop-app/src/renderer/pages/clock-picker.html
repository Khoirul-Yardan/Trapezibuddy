<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Time</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg:           #FBF9F8;
      --c-primary:      #A2B29F;
      --c-thatch:       #798777;
      --c-dark:         #3B3B3A;
      --c-mid:          #757676;
      --c-cal-bg:       #FDF2E8;
    }

    html, body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: white;
      color: var(--c-dark);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .clock-picker-container {
      width: 100%;
      padding: 0 20px 16px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .clock-picker-drag-zone {
      width: 100%;
      cursor: move;
      -webkit-app-region: drag;
      padding: 16px 0 16px;
      display: flex;
      justify-content: center;
    }

    .clock-picker-header {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #AAAAAA;
      text-align: center;
      -webkit-app-region: drag;
    }

    .clock-picker-time-input {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .clock-picker-input-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .clock-picker-input-box {
      width: 96px;
      height: 96px;
      border: 2px solid transparent;
      border-radius: 14px;
      background: var(--c-cal-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      font-weight: 700;
      color: var(--c-dark);
      cursor: text;
      position: relative;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      -webkit-app-region: no-drag;
    }

    .clock-picker-input-box:hover {
      background: #FFF9F0;
    }

    .clock-picker-input-box.focused {
      border-color: var(--c-primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(162, 178, 159, 0.15);
    }

    .clock-picker-input-box input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      font-size: 44px;
      font-weight: 700;
      color: inherit;
      text-align: center;
      outline: none;
      font-family: inherit;
      padding: 0;
      caret-color: transparent;
      -moz-appearance: textfield;
      -webkit-app-region: no-drag;
    }

    .clock-picker-input-box input::-webkit-outer-spin-button,
    .clock-picker-input-box input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .clock-picker-input-label {
      font-size: 11px;
      font-weight: 600;
      color: #BBBBBB;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .clock-picker-colon {
      font-size: 44px;
      font-weight: 700;
      color: var(--c-mid);
      margin-bottom: 28px;
      line-height: 1;
    }

    .clock-picker-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      -webkit-app-region: no-drag;
    }

    .clock-picker-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .clock-picker-btn {
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--c-primary);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      transition: background 0.15s, transform 0.1s;
      font-family: inherit;
      text-transform: uppercase;
      -webkit-app-region: no-drag;
    }

    .clock-picker-btn:hover {
      background: rgba(162, 178, 159, 0.12);
    }

    .clock-picker-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <div class="clock-picker-container">

    <div class="clock-picker-drag-zone">
      <div class="clock-picker-header">ENTER TIME</div>
    </div>

    <div class="clock-picker-time-input">
      <!-- Hour -->
      <div class="clock-picker-input-group">
        <div class="clock-picker-input-box" id="hour-box">
          <input type="number" id="clock-hour" min="0" max="23" value="12" />
        </div>
        <div class="clock-picker-input-label">Hour</div>
      </div>

      <!-- Colon -->
      <div class="clock-picker-colon">:</div>

      <!-- Minute -->
      <div class="clock-picker-input-group">
        <div class="clock-picker-input-box" id="minute-box">
          <input type="number" id="clock-minute" min="0" max="59" value="00" />
        </div>
        <div class="clock-picker-input-label">Minute</div>
      </div>
    </div>

    <div class="clock-picker-footer">
      <div class="clock-picker-actions">
        <button class="clock-picker-btn" id="btn-cancel" type="button">Cancel</button>
        <button class="clock-picker-btn" id="btn-ok" type="button">OK</button>
      </div>
    </div>

  </div>

  <script>
    const api = window.trapezi;

    const hourInput  = document.getElementById('clock-hour');
    const minuteInput = document.getElementById('clock-minute');
    const hourBox    = document.getElementById('hour-box');
    const minuteBox  = document.getElementById('minute-box');

    // ── Parse URL param ──────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const initialTime = params.get('time');
    if (initialTime) {
      const [h, m] = initialTime.split(':').map(s => parseInt(s) || 0);
      hourInput.value   = String(Math.min(23, Math.max(0, h))).padStart(2, '0');
      minuteInput.value = String(Math.min(59, Math.max(0, m))).padStart(2, '0');
    } else {
      // Default to current time
      const now = new Date();
      hourInput.value   = String(now.getHours()).padStart(2, '0');
      minuteInput.value = String(now.getMinutes()).padStart(2, '0');
    }

    // ── Focus / blur ─────────────────────────────────────────
    hourBox.addEventListener('click', () => { hourInput.focus(); hourInput.select(); });
    minuteBox.addEventListener('click', () => { minuteInput.focus(); minuteInput.select(); });

    hourInput.addEventListener('focus', () => { hourBox.classList.add('focused'); hourInput.select(); });
    hourInput.addEventListener('blur',  () => {
      hourBox.classList.remove('focused');
      let v = parseInt(hourInput.value);
      if (isNaN(v) || v < 0) v = 0;
      if (v > 23) v = 23;
      hourInput.value = String(v).padStart(2, '0');
    });

    minuteInput.addEventListener('focus', () => { minuteBox.classList.add('focused'); minuteInput.select(); });
    minuteInput.addEventListener('blur',  () => {
      minuteBox.classList.remove('focused');
      let v = parseInt(minuteInput.value);
      if (isNaN(v) || v < 0) v = 0;
      if (v > 59) v = 59;
      minuteInput.value = String(v).padStart(2, '0');
    });

    // ── Hour validation & auto-advance ───────────────────────
    let hourBuffer = '';

    hourInput.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        hourBuffer += e.key;

        const num = parseInt(hourBuffer);

        // If first digit > 2, it can't be a valid 2-digit hour start — clamp immediately
        if (hourBuffer.length === 1 && num > 2) {
          hourInput.value = String(num).padStart(2, '0');
          hourBuffer = '';
          minuteInput.focus();
          minuteInput.select();
          return;
        }

        hourInput.value = hourBuffer.padStart(2, '0');

        if (hourBuffer.length >= 2) {
          let clamped = Math.min(23, Math.max(0, num));
          hourInput.value = String(clamped).padStart(2, '0');
          hourBuffer = '';
          minuteInput.focus();
          minuteInput.select();
        }
      } else if (e.key === 'Backspace') {
        hourBuffer = hourBuffer.slice(0, -1);
      } else if (e.key === 'Tab' || e.key === 'ArrowRight') {
        hourBuffer = '';
      } else if (e.key === 'Enter') {
        minuteInput.focus();
        minuteInput.select();
      }
    });

    hourInput.addEventListener('focus', () => { hourBuffer = ''; });

    // ── Minute validation ────────────────────────────────────
    let minuteBuffer = '';

    minuteInput.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        minuteBuffer += e.key;

        const num = parseInt(minuteBuffer);

        // First digit > 5 → single-digit minute
        if (minuteBuffer.length === 1 && num > 5) {
          minuteInput.value = String(num).padStart(2, '0');
          minuteBuffer = '';
          return;
        }

        minuteInput.value = minuteBuffer.padStart(2, '0');

        if (minuteBuffer.length >= 2) {
          let clamped = Math.min(59, Math.max(0, num));
          minuteInput.value = String(clamped).padStart(2, '0');
          minuteBuffer = '';
          minuteInput.blur();
        }
      } else if (e.key === 'Backspace') {
        minuteBuffer = minuteBuffer.slice(0, -1);
      } else if (e.key === 'Enter') {
        confirmTime();
      }
    });

    minuteInput.addEventListener('focus', () => { minuteBuffer = ''; });

    // ── OK / Cancel ──────────────────────────────────────────
    function confirmTime() {
      let h = parseInt(hourInput.value);
      let m = parseInt(minuteInput.value);
      if (isNaN(h)) h = 0;
      if (isNaN(m)) m = 0;
      h = Math.min(23, Math.max(0, h));
      m = Math.min(59, Math.max(0, m));
      const timeString = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      if (api && api.clock) api.clock.selectTime(timeString);
    }

    document.getElementById('btn-ok').addEventListener('click', confirmTime);

    document.getElementById('btn-cancel').addEventListener('click', () => {
      if (api && api.clock) api.clock.close();
    });

    // ── Keyboard shortcuts ───────────────────────────────────
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && api && api.clock) api.clock.close();
    });

    // ── Auto-focus hour on load ──────────────────────────────
    setTimeout(() => { hourInput.focus(); hourInput.select(); }, 100);
  </script>
</body>
</html>
